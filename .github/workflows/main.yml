name: Build Offline Package (PyMySQL)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'   # 纯 Python 包，用哪个版本下载都一样

      - name: Download wheels
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path wheelhouse
          python -m pip download PyMySQL -d wheelhouse --only-binary=:all:

      - name: Bundle
        run: Compress-Archive -Path .\* -DestinationPath offline-package.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: offline-package-pymysql
          path: offline-package.zip
